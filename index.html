<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán 6 – Ôn tập giữa kì I</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#667085;--accent:#2f5bea;--accent-t:#fff;--ok:#16794c;--okbg:#e3f6ec;--bad:#b42318;--badbg:#fde8e6;--line:#e0e5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--text:#e8ecf4;--muted:#9aa4b8;--accent:#6c8cff;--accent-t:#0b1020;--ok:#5dd39e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--line:#2b3244;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--text:#e8ecf4;--muted:#9aa4b8;--accent:#6c8cff;--accent-t:#0b1020;--ok:#5dd39e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--line:#2b3244;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px 20px;font-size:1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
select{font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#timer{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad)}
.sec h2{font-size:1.1rem;margin:0 0 2px}.ins{color:var(--muted);font-style:italic;margin:0 0 10px}
.pre{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;white-space:pre-line}
.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:600;margin-bottom:6px}
.qt img{display:block;max-height:140px;max-width:100%;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer}
.opt input{margin-top:5px}
.opt:has(input:checked){border-color:var(--accent);background:var(--bg)}
input[type=text]{width:100%;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.res{margin-top:6px;font-size:.95rem}.res b.g{color:var(--ok)}.res b.r{color:var(--bad)}
.score{text-align:center}.big{font-size:3.2rem;font-weight:800;color:var(--accent);line-height:1.1}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.warn{color:var(--bad);font-weight:600;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head><body>

EXAMS.forEach(e=>{let n=0;e.n=0;e.secs.forEach(s=>s.items.forEach(i=>{i.id=n++}));e.n=n;e.max=e.secs.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.w,0),0)});
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const norm=s=>{s=String(s||'').toLowerCase().replace(/\s+/g,'').replace(/^x=/,'').replace(/(đồng|viên|m²|m2|cm|m|đ)$/,'');if(/^\d{1,3}([.,]\d{3})+$/.test(s))s=s.replace(/[.,]/g,'');return s.replace(/[{}]/g,'').replace(/,/g,';')};
let E,ans={},end=0,tick=null,warned=false,mins=90;
const isOk=(i,v)=>v==null||v===''?false:i.t==='mc'?(Array.isArray(i.a)?i.a.includes(v):v===i.a):i.a.some(a=>norm(a)===norm(v));
const answered=()=>Object.values(ans).filter(v=>v!==undefined&&String(v).trim()!=='').length;
function home(){clearInterval(tick);app.innerHTML=`<div class="wrap"><div class="card"><h1>📐 Toán 6 – Ôn tập giữa kì I</h1><p>Năm học 2026–2027 · Chọn đề, bấm làm bài. Hết giờ hệ thống tự nộp; nộp xong sẽ có điểm (thang 10), đáp án và lời giải.</p><p><label>Thời gian: <select id="mins">${[30,45,60,90].map(m=>`<option value="${m}"${m===mins?' selected':''}>${m} phút</option>`).join('')}</select></label></p><div class="row">${EXAMS.map((e,k)=>`<button class="btn" data-e="${k}">${e.name} (${e.n} câu)</button>`).join('')}</div></div></div>`;$('#mins').onchange=e=>mins=+e.target.value;app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>start(+b.dataset.e))}
function start(k=EXAMS.indexOf(E)){E=EXAMS[k];ans={};warned=false;end=Date.now()+mins*60000;renderExam();scrollTo(0,0);clearInterval(tick);tick=setInterval(upd,500);upd()}
function renderExam(){
 app.innerHTML=`<div id="bar"><div><div id="timer">--:--</div><small id="prog"></small></div><button class="btn" id="sub">Nộp bài</button></div><div class="wrap" id="exam"><h1 style="font-size:1.2rem">${E.name}</h1>`+E.secs.map(s=>`<div class="card sec"><h2>${s.title}</h2><p class="ins">${s.ins}</p>${s.items.map((i,k)=>qHTML(i,k+1)).join('')}</div>`).join('')+`<div id="msg" class="warn"></div><div class="row"><button class="btn" id="sub2">Nộp bài</button></div></div>`;
 $('#sub').onclick=$('#sub2').onclick=submit;
 $('#exam').addEventListener('input',e=>{const t=e.target,id=+t.dataset.id;ans[id]=t.type==='radio'?+t.dataset.k:t.value;warned=false;upd()})}
function qHTML(i,k){let b=`<div class="qt">${k}. ${esc(i.q).replace(/\n/g,'<br>')}${i.img?`<img src="${i.img}" alt="">`:''}</div>`;
 b+=i.t==='mc'?i.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i.id}" data-id="${i.id}" data-k="${j}"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<input type="text" data-id="${i.id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập đáp số">`;
 return `<div class="q">${b}</div>`}
function upd(){const left=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#timer');if(!t)return;t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<300);$('#prog').textContent=`Đã làm ${answered()}/${E.n} câu`;if(left<=0)finish()}
function submit(){const un=E.n-answered();if(un>0&&!warned){warned=true;$('#msg').textContent=`Còn ${un} câu chưa làm. Bấm “Nộp bài” lần nữa nếu muốn nộp luôn.`;$('#msg').scrollIntoView({block:'center'});return}finish()}
const show=i=>i.t==='mc'?(Array.isArray(i.a)?i.a.map(j=>'ABCD'[j]+'. '+i.o[j]).join(' hoặc '):'ABCD'[i.a]+'. '+i.o[i.a]):i.a[0];
const mine=(i,v)=>v==null||v===''?'(chưa làm)':i.t==='mc'?'ABCD'[v]+'. '+i.o[v]:v;
function finish(){clearInterval(tick);let pts=0,cnt=0;const tl=$('#timer')?$('#timer').textContent:'';
 const rows=E.secs.map(s=>{let p=0,mx=0;s.items.forEach(i=>{mx+=i.w;if(isOk(i,ans[i.id])){p+=i.w;cnt++}});pts+=p;return `<tr><td>${s.title}</td><td>${fmt(p)}/${fmt(mx)} điểm</td></tr>`}).join('');
 const rev=E.secs.map(s=>`<div class="card sec"><h2>${s.title}</h2>`+s.items.map((i,k)=>{const ok=isOk(i,ans[i.id]);return `<div class="q ${ok?'ok':'bad'}" style="border-radius:10px;padding:10px;margin:8px 0;border:1px solid"><div class="qt">${k+1}. ${esc(i.q).replace(/\n/g,'<br>')}${i.img?`<img src="${i.img}" alt="">`:''}</div><div class="res">${ok?'<b class="g">✓ Đúng</b> – '+esc(mine(i,ans[i.id])):`<b class="r">✗ Sai</b> – Bạn chọn/nhập: ${esc(mine(i,ans[i.id]))}<br><b class="g">Đáp án đúng:</b> ${esc(show(i))}`}${i.ex?`<br><small>💡 ${esc(i.ex)}</small>`:''}</div></div>`}).join('')+`</div>`).join('');
 app.innerHTML=`<div class="wrap"><div class="card score"><div>${E.name} – Kết quả</div><div class="big">${fmt(pts)}/10</div><p>Đúng <b>${cnt}/${E.n}</b> câu · Thời gian còn lại ${tl}</p><table>${rows}</table><p><small>Phần tự luận được chấm theo đáp số cuối cùng; điểm thực tế còn tuỳ cách trình bày của thầy/cô.</small></p><div class="row" style="justify-content:center"><button class="btn" id="redo">🔄 Làm lại đề từ đầu</button><button class="btn ghost" id="wrong">Chỉ xem câu sai</button><button class="btn ghost" id="hm">Chọn đề khác</button></div></div>${rev}</div>`;
 scrollTo(0,0);$('#redo').onclick=()=>start();$('#hm').onclick=home;let only=false;$('#wrong').onclick=e=>{only=!only;document.querySelectorAll('.q.ok').forEach(x=>x.style.display=only?'none':'');e.target.textContent=only?'Xem tất cả':'Chỉ xem câu sai'}}
home();
</script></body></html>
